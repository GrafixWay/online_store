<div data-fls-product class="product [[class]]">
	<article class="product__card">
		<div class="product__sale">sale</div>
		<a href="#" class="product__favorite product__favorite--icon-heart"></a>
		<img class="product__img" src="@img/product/[[img]].png" alt="Image" />
		<a href="#" class="product__button">посмотреть товар</a>
		<p class="product__text">[[text]]</p>
		<p class="product__price">[[price]]</p>
	</article>
	<a href="#" class="product__cart product__cart--icon-cart"></a>
	<a href="#" class="product__out-stock">Сообщить о поступлении</a>
</div>
